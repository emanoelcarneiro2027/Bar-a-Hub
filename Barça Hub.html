<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barça Hub</title>
    <link rel="stylesheet" href="Barça Hub.css">
</head>
<body>
   
    <main class="login-container">
        
      <section class="login-box">
        <h1>BEM-VINDO DE VOLTA</h1>
        <p>Acesse sua conta para continuar</p>

        <label for="email">E-MAIL</label>
        <input type="email" id="email" placeholder="Digite aqui....">

        <label for="senha">SENHA</label>
        <input type="password" id="senha" placeholder="Digite aqui....">

        <button id="btnEntrar">ENTRAR NO PORTAL</button>

        <div class="cadastro">
            <p>Ainda não possui uma conta?</p>
            <a href="Barça Cadastro.html">Criar conta</a>
        </div>
      </section>

        <img 
            src="https://thumb.wikimedia.org/wikipedia/pt/thumb/4/43/FCBarcelona.svg/1280px-FCBarcelona.svg.png?utm_source=pt.wikipedia.org&utm_campaign=index&utm_content=thumbnail" 
            alt="Escudo do Barcelona" 
            class="logo"
>
    </main>

    <script src="Barça Hub.js"></script>
 </body>
</html>
